# Official Google Ads MCP server, scoped to this trusted project.
# Credentials are intentionally read from the local environment and never stored in Git.
[mcp_servers.google-ads]
command = "/Users/aark/.local/bin/uvx"
args = [
  "--from",
  "git+https://github.com/googleads/google-ads-mcp.git",
  "google-ads-mcp",
]
env_vars = [
  "GOOGLE_PROJECT_ID",
  "GOOGLE_CLOUD_PROJECT",
  "GOOGLE_ADS_DEVELOPER_TOKEN",
  "GOOGLE_APPLICATION_CREDENTIALS",
]
enabled = false
required = false
startup_timeout_sec = 120
tool_timeout_sec = 120
enabled_tools = [
  "list_accessible_customers",
  "search",
  "get_resource_metadata",
]
default_tools_approval_mode = "auto"
